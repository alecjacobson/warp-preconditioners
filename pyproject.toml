[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-preconditioners"
version = "0.1.0"
description = "Pure NVIDIA Warp factorized sparse approximate inverse preconditioners"
requires-python = ">=3.10"
dependencies = ["warp-lang>=1.15"]

[project.optional-dependencies]
test = ["numpy", "scipy", "pytest"]
visualization = ["numpy", "scipy", "libigl", "Pillow", "matplotlib"]

[tool.setuptools.packages.find]
include = ["warp_preconditioners*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
